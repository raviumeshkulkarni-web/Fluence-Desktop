name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Moonshine v2 sidecar (experiment branch, opt-in engines only).
      # Fetches the official prebuilt C++ core + ONNX Runtime and verifies
      # it against the reviewed digest in
      # src-tauri/moonshine-v2-server/VENDOR.json — the single source of
      # truth. Nothing here trusts a developer machine: a digest mismatch
      # fails the release before anything compiles.
      - name: fetch moonshine v2 vendor bundle
        shell: pwsh
        run: |
          $vendor = Get-Content src-tauri/moonshine-v2-server/VENDOR.json | ConvertFrom-Json
          $dest = ".vendor/moonshine-voice-windows-x86_64.tar.gz"
          New-Item -ItemType Directory -Force -Path ".vendor/moonshine" | Out-Null
          Invoke-WebRequest -Uri $vendor.url -OutFile $dest
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $dest).Hash.ToLower()
          if ($actual -ne $vendor.sha256) {
            throw "Vendor digest mismatch: expected $($vendor.sha256), got $actual"
          }
          $size = (Get-Item -LiteralPath $dest).Length
          if ($size -ne $vendor.size_bytes) {
            throw "Vendor size mismatch: expected $($vendor.size_bytes), got $size"
          }
          # Layout must match build.rs default:
          # <repo>/.vendor/moonshine/moonshine-voice-windows-x86_64/{include,lib}
          tar -xzf $dest -C .vendor/moonshine
          if (-not (Test-Path ".vendor/moonshine/moonshine-voice-windows-x86_64/lib/onnxruntime.dll")) {
            throw "Vendor extract missing onnxruntime.dll"
          }

      # Builds the workspace-member sidecar, then stages the Tauri
      # externalBin + resource files the bundler requires to exist BEFORE
      # `tauri build` runs. The app build.rs hashes the staged exe and bakes
      # it in as MOONSHINE_V2_SERVER_SHA256 for the runtime spawn gate.
      - name: build and stage moonshine v2 sidecar
        shell: pwsh
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml -p moonshine-v2-server
          $triple = (rustc --print host-tuple).Trim()
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Copy-Item "src-tauri/target/release/moonshine-v2-server.exe" `
            "src-tauri/binaries/moonshine-v2-server-$triple.exe" -Force
          Copy-Item "src-tauri/target/release/onnxruntime.dll" `
            "src-tauri/binaries/onnxruntime.dll" -Force
          if (-not (Test-Path "src-tauri/binaries/moonshine-v2-server-$triple.exe")) {
            throw "Sidecar staging failed"
          }

      # Quality gate: a pushed tag must never ship an untested tree.
      # (clippy/fmt stay advisory for now: pre-existing lints would fail CI.)
      - name: run backend test suite
        working-directory: src-tauri
        run: cargo test --lib

      - name: run frontend + security test suite
        shell: pwsh
        run: |
          node --test "tests/*.test.mjs"
          pwsh -File tests/verify-security.ps1

      - name: install frontend dependencies
        run: npm ci

      # The React migration (v1.20.0+) builds via tauri.conf
      # beforeBuildCommand `npm run web:build`, which needs web/node_modules
      # (tsc, vite). Root `npm ci` does not install them (no workspaces),
      # and a fresh checkout has no node_modules — without this step the
      # build fails instantly with `'tsc' is not recognized` (v1.20.0 run 54).
      - name: install web frontend dependencies
        run: npm ci --prefix web

      - name: build and release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: 'Fluence v__VERSION__'
          releaseBody: |
            ## Fluence v__VERSION__ — Agent Mode, Formatting, and a rebuilt Settings shell

            This release brings Agent Mode to life, adds a Formatting surface, and rebuilds the Settings app on a shared component shell.

            ### Agent Mode

            - Start an agent turn from the keyboard with the agent hotkey, or from the tray.
            - **Agents page:** create, edit, and delete custom agents, each with its own instructions.
            - Pick a persistent **default agent** in Settings; Agent Mode runs with it, so you rarely need to think about which agent is active.
            - New backend modules for the agent store, prompt templates, foreground-app detection, and installed-app enumeration.
            - Only the agent *id* crosses the IPC boundary — prompt text stays on the server side, in `agents.json`.
            - Credential handling is fail-closed: a missing LLM key or a denied credential target reports a clear, non-retryable status instead of a generic failure.

            ### Formatting

            - New **Formatting page** for text cleanup and polish behaviour, backed by a new prompts service and a dedicated `Formatting` IPC module.

            ### Settings rebuilt on a shared shell

            - New shared `SettingsSection` composition and `Sidebar`, `Table`, `ToggleGroup`, and `Empty` primitives, so every page shares one layout and one table surface.
            - **History:** row selection, purpose-built empty states, and a real pager with its own chrome instead of ad-hoc paging.
            - **Providers, Dictionary, and Snippets:** one consistency pass across copy, layout, and empty states.
            - Onboarding wizard steps updated to match the new Settings surfaces.
            - Agent and bubble previews rebalanced so the overlays read the same in Settings as they do in the app.

            ### Overlay

            - The expandable Agent Picker card was built and then **intentionally held back from this release**: its bottom-docked placement had a rendering/compositor glitch. Agent Mode ships using the default agent chosen in Settings, and the overlay keeps the stable bubble and pill.
            - Overlay geometry is still committed as a single atomic native window operation, so every dock — top, bottom, left, right, and the three bottom variants — places consistently.

            ### Verification

            - Full Rust suite green (`cargo test --lib`, 443 tests).
            - Frontend and security suites are now a **required** CI gate on every tag (they were previously manual-only).
            - Release-profile compile and Clippy are clean.
            - Manually verified in the dev app: Agent Mode start/stop and agent execution, overlay bubble and pill across all six dock positions, and the Settings rebuild.

            ---
            ### Download & Install

            Download the installer (`.exe`) below to install or update Fluence on Windows.
          releaseDraft: false
          prerelease: false