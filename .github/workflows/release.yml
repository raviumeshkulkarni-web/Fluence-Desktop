name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      # Third-party actions are pinned by commit SHA (verified via
      # `git ls-remote`): tag refs like `v4` are mutable and could be
      # repointed to malicious code between two release runs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: setup node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: lts/*

      # Pinned by SHA (matching the pin policy above); the explicit
      # toolchain pins the compiler to the version validated locally
      # (rustc 1.97.1) so release artifacts and test results come from the
      # same compiler the dev tree is validated with.
      - name: install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.97.1"

      # Moonshine v2 sidecar (experiment branch, opt-in engines only).
      # Fetches the official prebuilt C++ core + ONNX Runtime and verifies
      # it against the reviewed digest in
      # src-tauri/moonshine-v2-server/VENDOR.json — the single source of
      # truth. Nothing here trusts a developer machine: a digest mismatch
      # fails the release before anything compiles.
      - name: fetch moonshine v2 vendor bundle
        shell: pwsh
        run: |
          $vendor = Get-Content src-tauri/moonshine-v2-server/VENDOR.json | ConvertFrom-Json
          $dest = ".vendor/moonshine-voice-windows-x86_64.tar.gz"
          New-Item -ItemType Directory -Force -Path ".vendor/moonshine" | Out-Null
          Invoke-WebRequest -Uri $vendor.url -OutFile $dest
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $dest).Hash.ToLower()
          if ($actual -ne $vendor.sha256) {
            throw "Vendor digest mismatch: expected $($vendor.sha256), got $actual"
          }
          $size = (Get-Item -LiteralPath $dest).Length
          if ($size -ne $vendor.size_bytes) {
            throw "Vendor size mismatch: expected $($vendor.size_bytes), got $size"
          }
          # Layout must match build.rs default:
          # <repo>/.vendor/moonshine/moonshine-voice-windows-x86_64/{include,lib}
          # Absolute path: a repo-local tar.exe on PATH must not be able to
          # repoint the archive extraction step of a release run.
          C:\Windows\System32\tar.exe -xzf $dest -C .vendor/moonshine
          if (-not (Test-Path ".vendor/moonshine/moonshine-voice-windows-x86_64/lib/onnxruntime.dll")) {
            throw "Vendor extract missing onnxruntime.dll"
          }

      # Builds the workspace-member sidecar, then stages the Tauri
      # externalBin + resource files the bundler requires to exist BEFORE
      # `tauri build` runs. The app build.rs hashes the staged exe and bakes
      # it in as MOONSHINE_V2_SERVER_SHA256 for the runtime spawn gate.
      - name: build and stage moonshine v2 sidecar
        shell: pwsh
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml -p moonshine-v2-server
          $triple = (rustc --print host-tuple).Trim()
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Copy-Item "src-tauri/target/release/moonshine-v2-server.exe" `
            "src-tauri/binaries/moonshine-v2-server-$triple.exe" -Force
          Copy-Item "src-tauri/target/release/onnxruntime.dll" `
            "src-tauri/binaries/onnxruntime.dll" -Force
          if (-not (Test-Path "src-tauri/binaries/moonshine-v2-server-$triple.exe")) {
            throw "Sidecar staging failed"
          }

      # Quality gate: a pushed tag must never ship an untested tree.
      # (clippy/fmt stay advisory for now: pre-existing lints would fail CI.)
      - name: run backend test suite
        working-directory: src-tauri
        run: cargo test --lib

      # Ordering: the node frontend suite must run AFTER the dependency installs
      # below, not before. tests/credential-target-parity.test.mjs does
      # `require('../web/node_modules/typescript')`, which only resolves once
      # `npm ci --prefix web` has populated web/node_modules. Run the tests
      # first and a fresh checkout fails with "Cannot find module
      # '../web/node_modules/typescript'" — green on a developer machine that
      # already has web/node_modules, red in CI. `cargo test --lib` stays above
      # because it has no web dependency.
      - name: install frontend dependencies
        run: npm ci

      # The React migration (v1.20.0+) builds via tauri.conf
      # beforeBuildCommand `npm run web:build`, which needs web/node_modules
      # (tsc, vite). Root `npm ci` does not install them (no workspaces),
      # and a fresh checkout has no node_modules — without this step the
      # build fails instantly with `'tsc' is not recognized` (v1.20.0 run 54).
      # It must also land before the node test suite below, which compiles
      # web/src/ipc/providers.ts through web/node_modules/typescript.
      - name: install web frontend dependencies
        run: npm ci --prefix web

      # Fresh-checkout guard: the node suite silently depends on the web
      # frontend's typescript. If that install ever regresses again, fail
      # loudly here instead of reporting a confusing module-not-found.
      - name: verify web typescript is installed
        shell: pwsh
        run: |
          $ts = "web/node_modules/typescript"
          if (-not (Test-Path -LiteralPath $ts)) {
            throw "Missing web/node_modules/typescript: the node test suite requires it. Run `npm ci --prefix web` before `node --test tests/*.test.mjs`."
          }
          $pkg = Get-Content -LiteralPath "$ts/package.json" -Raw | ConvertFrom-Json
          Write-Host "typescript $($pkg.version) present at web/node_modules/typescript"

      - name: run frontend + security test suite
        shell: pwsh
        run: |
          node --test "tests/*.test.mjs"
          npm test --prefix web
          pwsh -File tests/verify-security.ps1

      # Release notes live in exactly one place (.github/RELEASE_BODY.md,
      # the file reviewers read first). Publishing extracts them verbatim
      # at tag-push time with a heredoc output, so a future tag can never
      # publish this release's narrative by accident — it publishes
      # whatever that file contains when the tag lands.
      - name: prepare release notes
        id: notes
        shell: pwsh
        run: |
          $body = Get-Content -LiteralPath .github/RELEASE_BODY.md -Raw
          if ([string]::IsNullOrWhiteSpace($body)) {
            throw ".github/RELEASE_BODY.md is empty: refusing to publish notes-less release"
          }
          $heredoc = "body<<EOF_MULTI`n" + $body + "`nEOF_MULTI"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $heredoc

      - name: build and release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2 (peeled commit; the annotated tag object is 1ddc7b4)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: 'Fluence v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
