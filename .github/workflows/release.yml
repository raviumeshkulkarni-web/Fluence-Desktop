name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Moonshine v2 sidecar (experiment branch, opt-in engines only).
      # Fetches the official prebuilt C++ core + ONNX Runtime and verifies
      # it against the reviewed digest in
      # src-tauri/moonshine-v2-server/VENDOR.json — the single source of
      # truth. Nothing here trusts a developer machine: a digest mismatch
      # fails the release before anything compiles.
      - name: fetch moonshine v2 vendor bundle
        shell: pwsh
        run: |
          $vendor = Get-Content src-tauri/moonshine-v2-server/VENDOR.json | ConvertFrom-Json
          $dest = ".vendor/moonshine-voice-windows-x86_64.tar.gz"
          New-Item -ItemType Directory -Force -Path ".vendor/moonshine" | Out-Null
          Invoke-WebRequest -Uri $vendor.url -OutFile $dest
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $dest).Hash.ToLower()
          if ($actual -ne $vendor.sha256) {
            throw "Vendor digest mismatch: expected $($vendor.sha256), got $actual"
          }
          $size = (Get-Item -LiteralPath $dest).Length
          if ($size -ne $vendor.size_bytes) {
            throw "Vendor size mismatch: expected $($vendor.size_bytes), got $size"
          }
          # Layout must match build.rs default:
          # <repo>/.vendor/moonshine/moonshine-voice-windows-x86_64/{include,lib}
          tar -xzf $dest -C .vendor/moonshine
          if (-not (Test-Path ".vendor/moonshine/moonshine-voice-windows-x86_64/lib/onnxruntime.dll")) {
            throw "Vendor extract missing onnxruntime.dll"
          }

      # Builds the workspace-member sidecar, then stages the Tauri
      # externalBin + resource files the bundler requires to exist BEFORE
      # `tauri build` runs. The app build.rs hashes the staged exe and bakes
      # it in as MOONSHINE_V2_SERVER_SHA256 for the runtime spawn gate.
      - name: build and stage moonshine v2 sidecar
        shell: pwsh
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml -p moonshine-v2-server
          $triple = (rustc --print host-tuple).Trim()
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Copy-Item "src-tauri/target/release/moonshine-v2-server.exe" `
            "src-tauri/binaries/moonshine-v2-server-$triple.exe" -Force
          Copy-Item "src-tauri/target/release/onnxruntime.dll" `
            "src-tauri/binaries/onnxruntime.dll" -Force
          if (-not (Test-Path "src-tauri/binaries/moonshine-v2-server-$triple.exe")) {
            throw "Sidecar staging failed"
          }

      # Quality gate: a pushed tag must never ship an untested tree.
      # (clippy/fmt stay advisory for now: pre-existing lints would fail CI.)
      - name: run backend test suite
        working-directory: src-tauri
        run: cargo test --lib

      - name: run frontend + security test suite
        shell: pwsh
        run: |
          node --test "tests/*.test.mjs"
          pwsh -File tests/verify-security.ps1

      - name: install frontend dependencies
        run: npm ci

      # The React migration (v1.20.0+) builds via tauri.conf
      # beforeBuildCommand `npm run web:build`, which needs web/node_modules
      # (tsc, vite). Root `npm ci` does not install them (no workspaces),
      # and a fresh checkout has no node_modules — without this step the
      # build fails instantly with `'tsc' is not recognized` (v1.20.0 run 54).
      - name: install web frontend dependencies
        run: npm ci --prefix web

      - name: build and release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: 'Fluence v__VERSION__'
          releaseBody: |
            ## Take your Agents and Styles with you

            If you created custom Agents or AI cleanup Styles **before** you had a Fluence account, they were locked away: greyed out, unusable, and unable to sync. They were never lost - they just couldn't be attached to an account.

            Now you can add them yourself, one tap at a time.

            ### What's new

            **"Add to my account" on your old Agents and Styles**

            Any pre-account Agent or Style you see now has an **Add to my account** button. Tap it and it becomes a normal part of your account:

            - you can edit it like any other
            - you can delete it
            - it becomes available to Agent Mode and AI cleanup
            - it syncs to your other devices

            Nothing is moved or deleted behind your back. Until you tap, your old records stay exactly where they are, and if anything goes wrong they're still there to try again.

            ### Fixes

            - **Deleting an Agent or Style now really deletes it.** Previously a deleted item could reappear as a device-only entry after you signed out. This now works for Styles the same way it already did for Agents.
            - **Honest delete confirmations.** If a delete can't be saved to your account, we now tell you instead of reporting success - and your data is left untouched.
            - **Your choices are protected.** If a delete doesn't go through, your default Agent and any app-specific Style assignments stay exactly as they were.

            ### For the technical minded

            Nothing about how your data syncs has changed - same format, same folders, same conflict rules. A claimed item is stored exactly like an item you created inside the app, so it uploads and merges through the normal path. The app can only ever add to the account you are signed in to at the moment you tap; there is no way for any part of the app to aim a claim at a different account.

            Both sign-in states remain supported: signed out, your old items still work as before; signed in, you choose what to add.

            ### Verification

            - Full Rust suite green (`cargo test --lib`, 614 tests).
            - Web claim suite green (17 tests), including a boundary test asserting the claim command carries only a record id.
            - Web typecheck and production build clean; no new dependencies, no sync/schema changes.

            ---

            ### Download & Install

            Download the installer (`.exe`) below to install or update Fluence on Windows.
          releaseDraft: false
          prerelease: false
