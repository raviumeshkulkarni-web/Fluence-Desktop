name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Moonshine v2 sidecar (experiment branch, opt-in engines only).
      # Fetches the official prebuilt C++ core + ONNX Runtime and verifies
      # it against the reviewed digest in
      # src-tauri/moonshine-v2-server/VENDOR.json — the single source of
      # truth. Nothing here trusts a developer machine: a digest mismatch
      # fails the release before anything compiles.
      - name: fetch moonshine v2 vendor bundle
        shell: pwsh
        run: |
          $vendor = Get-Content src-tauri/moonshine-v2-server/VENDOR.json | ConvertFrom-Json
          $dest = ".vendor/moonshine-voice-windows-x86_64.tar.gz"
          New-Item -ItemType Directory -Force -Path ".vendor/moonshine" | Out-Null
          Invoke-WebRequest -Uri $vendor.url -OutFile $dest
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $dest).Hash.ToLower()
          if ($actual -ne $vendor.sha256) {
            throw "Vendor digest mismatch: expected $($vendor.sha256), got $actual"
          }
          $size = (Get-Item -LiteralPath $dest).Length
          if ($size -ne $vendor.size_bytes) {
            throw "Vendor size mismatch: expected $($vendor.size_bytes), got $size"
          }
          # Layout must match build.rs default:
          # <repo>/.vendor/moonshine/moonshine-voice-windows-x86_64/{include,lib}
          tar -xzf $dest -C .vendor/moonshine
          if (-not (Test-Path ".vendor/moonshine/moonshine-voice-windows-x86_64/lib/onnxruntime.dll")) {
            throw "Vendor extract missing onnxruntime.dll"
          }

      # Builds the workspace-member sidecar, then stages the Tauri
      # externalBin + resource files the bundler requires to exist BEFORE
      # `tauri build` runs. The app build.rs hashes the staged exe and bakes
      # it in as MOONSHINE_V2_SERVER_SHA256 for the runtime spawn gate.
      - name: build and stage moonshine v2 sidecar
        shell: pwsh
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml -p moonshine-v2-server
          $triple = (rustc --print host-tuple).Trim()
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Copy-Item "src-tauri/target/release/moonshine-v2-server.exe" `
            "src-tauri/binaries/moonshine-v2-server-$triple.exe" -Force
          Copy-Item "src-tauri/target/release/onnxruntime.dll" `
            "src-tauri/binaries/onnxruntime.dll" -Force
          if (-not (Test-Path "src-tauri/binaries/moonshine-v2-server-$triple.exe")) {
            throw "Sidecar staging failed"
          }

      # Quality gate: a pushed tag must never ship an untested tree.
      # (clippy/fmt stay advisory for now: pre-existing lints would fail CI.)
      - name: run backend test suite
        working-directory: src-tauri
        run: cargo test --lib

      - name: install frontend dependencies
        run: npm ci

      # The React migration (v1.20.0+) builds via tauri.conf
      # beforeBuildCommand `npm run web:build`, which needs web/node_modules
      # (tsc, vite). Root `npm ci` does not install them (no workspaces),
      # and a fresh checkout has no node_modules — without this step the
      # build fails instantly with `'tsc' is not recognized` (v1.20.0 run 54).
      - name: install web frontend dependencies
        run: npm ci --prefix web

      - name: build and release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: 'Fluence v__VERSION__'
          releaseBody: |
            ## Fluence v__VERSION__ — Floating Bubble Studio, Overlay Fixes & Consistency

            This release gives the recording overlay its own home, fixes clicks being swallowed around the bubble and pill, and cleans up copy and spacing across every settings screen.

            ### What's New

            - **Floating Bubble Studio**:
              - New dedicated page (sidebar + Command Palette) with live previews that run the exact production overlay code, so what you see is what the hotkey summons.
              - Preview each style at real size, including the foreground app pill and halo state.
              - Overlay controls moved out of General into their new home.

            - **Overlay Customization**:
              - Halo Glow toggle: soft Amethyst halo while transcribing, teal in Agent Mode.
              - App Pill toggle: show or hide the foreground app name and icon above the overlay.
              - New placements: Top Left, Top Center, and Top Right, with matching docked-corner treatment.

            - **Overlay Fixes & Polish**:
              - The window now shrinks to each tier, so clicks near the bubble and compact pill reach the app underneath again.
              - Slimmer full island (320px) and a repositioned bubble close chip that no longer overlaps the orb.
              - Tier-timed open/close motion with a settled exit, entrance cascade, and hardened reduced-motion support.

            - **Consistency Sweep**:
              - Page titles match sidebar and palette labels everywhere.
              - Design-token spacing and type scale across Providers, Dictionary, Snippets, Sync, About, and Dashboard.
              - Plain, direct copy throughout.

            ---
            ### Download & Install

            Download the installer (`.exe` or `.msi`) below to install or update Fluence on Windows.
          releaseDraft: false
          prerelease: false

  # Linux release (Ubuntu/Fedora/Debian via deb + AppImage; rpm uses the
  # same tree, see CONTRIBUTING.md). The Windows `resources` entry
  # (onnxruntime.dll) does not exist on Linux - see the --config override
  # on the build step below.
  release-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libdbus-1-dev

      # Moonshine v2 sidecar, Linux asset. Mirrors the Windows pwsh step
      # above but reads src-tauri/moonshine-v2-server/VENDOR.linux.json.
      - name: fetch moonshine v2 vendor bundle (linux)
        shell: bash
        run: |
          set -euo pipefail
          URL=$(jq -r .url src-tauri/moonshine-v2-server/VENDOR.linux.json)
          SHA=$(jq -r .sha256 src-tauri/moonshine-v2-server/VENDOR.linux.json)
          SIZE=$(jq -r .size_bytes src-tauri/moonshine-v2-server/VENDOR.linux.json)
          SUBDIR=$(jq -r .extract_subdir src-tauri/moonshine-v2-server/VENDOR.linux.json)
          mkdir -p .vendor/moonshine
          DEST=".vendor/moonshine/moonshine-voice-linux-x86_64.tar.gz"
          curl -L "$URL" -o "$DEST"
          ACTUAL=$(sha256sum "$DEST" | cut -d' ' -f1)
          if [ "$ACTUAL" != "$SHA" ]; then
            echo "Vendor digest mismatch: expected $SHA, got $ACTUAL"
            exit 1
          fi
          ACTUAL_SIZE=$(stat -c%s "$DEST")
          if [ "$ACTUAL_SIZE" != "$SIZE" ]; then
            echo "Vendor size mismatch: expected $SIZE, got $ACTUAL_SIZE"
            exit 1
          fi
          tar -xzf "$DEST" -C .vendor/moonshine
          if [ ! -f ".vendor/moonshine/$SUBDIR/lib/libonnxruntime.so.1" ]; then
            echo "Vendor extract missing libonnxruntime.so.1"
            exit 1
          fi
          if [ ! -f ".vendor/moonshine/$SUBDIR/lib/libmoonshine.so" ]; then
            echo "Vendor extract missing libmoonshine.so"
            exit 1
          fi

      # Builds the workspace-member sidecar, then stages the Tauri
      # externalBin + resource files the bundler requires to exist BEFORE
      # `tauri build` runs. The sidecar build.rs already stages the shared
      # objects next to the built binary; this step mirrors them into the
      # Tauri binaries/ staging dir.
      - name: build and stage moonshine v2 sidecar (linux)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path src-tauri/Cargo.toml -p moonshine-v2-server
          TRIPLE=$(rustc --print host-tuple)
          mkdir -p src-tauri/binaries
          cp src-tauri/target/release/moonshine-v2-server \
            "src-tauri/binaries/moonshine-v2-server-$TRIPLE"
          cp src-tauri/target/release/libonnxruntime.so.1 \
            src-tauri/binaries/libonnxruntime.so.1
          cp src-tauri/target/release/libmoonshine.so \
            src-tauri/binaries/libmoonshine.so
          test -f "src-tauri/binaries/moonshine-v2-server-$TRIPLE"

      - name: run backend test suite
        working-directory: src-tauri
        run: cargo test --lib

      - name: install frontend dependencies
        run: npm ci

      - name: install web frontend dependencies
        run: npm ci --prefix web

      - name: build and release (linux)
        # Uploads deb/AppImage assets to the SAME tag release as the Windows
        # job (same tagName). Intentionally no releaseName/releaseBody here:
        # exactly one job must own the release notes, otherwise the two jobs
        # overwrite each other's body depending on finish order. Linux
        # install notes live in README.md instead.
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          # The Windows `resources` entry (onnxruntime.dll) does not exist on
          # Linux, and the Linux shared objects must sit BESIDE the sidecar
          # binary (/usr/bin) so the loader finds them via rpath $ORIGIN -
          # not in the resources dir (/usr/lib/Fluence). Hence: empty
          # resources + per-format `files` mapping (deb, rpm, AppImage).
          args: --bundles deb,appimage --config {"bundle":{"resources":[],"linux":{"deb":{"files":{"/usr/bin/libonnxruntime.so.1":"binaries/libonnxruntime.so.1","/usr/bin/libmoonshine.so":"binaries/libmoonshine.so"}},"rpm":{"files":{"/usr/bin/libonnxruntime.so.1":"binaries/libonnxruntime.so.1","/usr/bin/libmoonshine.so":"binaries/libmoonshine.so"}},"appimage":{"files":{"usr/bin/libonnxruntime.so.1":"binaries/libonnxruntime.so.1","usr/bin/libmoonshine.so":"binaries/libmoonshine.so"}}}}}