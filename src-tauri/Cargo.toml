[package]
name = "fluence-windows"
version = "1.2.1"
description = "Fluence — AI Voice Typing for Windows"
authors = ["Fluence Team"]
license = "GPL-3.0-only"
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "fluence_windows_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "tray-icon",
  "image-png",
] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"


serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "multipart", "json", "stream"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
once_cell = "1"
tokio-tungstenite = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
flacenc = "0.5.1"
shine-rs = "0.1"
regex = "1"
similar = { version = "3", features = ["text"] }
strsim = "0.11"



[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Security_Credentials",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
] }
cpal = "0.15"


[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0

[profile.dev.package.reqwest]
opt-level = 3

[profile.dev.package.hyper]
opt-level = 3

[profile.dev.package.tokio]
opt-level = 3

[profile.dev.package.native-tls]
opt-level = 3

[profile.dev.package.schannel]
opt-level = 3

[profile.dev.package.hound]
opt-level = 3

[profile.dev.package.base64]
opt-level = 3

[profile.dev.package.h2]
opt-level = 3
