[package]
name = "moonshine-v2-server"
version = "0.1.0"
edition = "2021"

# Standalone helper binary for the Fluence Windows app (experiment branch).
# NOT part of the Tauri workspace build: it links the official prebuilt
# Moonshine v2 C++ core (see ../../.vendor/moonshine) and serves the same
# localhost WebSocket protocol as the sherpa-onnx sidecar.

[[bin]]
name = "moonshine-v2-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
serde_json = "1"
