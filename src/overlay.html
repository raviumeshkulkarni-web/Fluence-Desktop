<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; connect-src http://ipc.localhost ws://ipc.localhost; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self';" />
  <title>Fluence Overlay</title>
  <link rel="stylesheet" href="css/overlay.css" />
</head>
<body>
  <!-- Separate small pill floating on the top edge: app icon + name -->
  <div class="app-pill" id="app-pill" hidden>
    <img class="app-pill-icon" id="app-pill-icon" alt="" width="16" height="16"
      src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" />
    <span class="app-pill-name" id="app-pill-name"></span>
  </div>

  <div class="overlay-root" id="overlay-root">

    <!-- Row 1: Metadata — REC indicator + mode badge -->
    <div class="card-meta">
      <div class="card-meta-left">
        <div class="card-rec" aria-label="Listening">
          <span class="rec-dot"></span>
          <span class="rec-label" id="rec-label" aria-live="polite">LISTENING</span>
        </div>
      </div>
      <span class="mode-badge" id="mode-badge">Transcribe</span>
    </div>

    <!-- Row 2: Waveform -->
    <div class="card-waveform">
      <canvas id="waveform-canvas"></canvas>
    </div>

    <!-- Row 3: Footer — timer + discard -->
    <div class="card-footer">
      <span class="card-timer" id="card-timer">00:00</span>
      <button class="card-discard" id="card-discard" type="button" title="Discard recording" aria-label="Discard recording">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M2 2l6 6M8 2L2 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>

    <!-- Status overlays (success/error) -->
    <div class="status-icon success-icon" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none">
        <path d="M3.3335 8.00016L6.66683 11.3335L13.3335 4.66683" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="status-icon error-icon" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none">
        <path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- End-of-flow confirmation (announced to screen readers) -->
    <div class="status-msg" id="status-msg" role="status" aria-live="polite">Inserted</div>
    <button class="status-retry" id="status-retry" type="button" hidden>Retry</button>
  </div>

  <script src="js/audio-viz.js"></script>
  <script src="js/overlay.js"></script>
</body>
</html>
