<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; connect-src http://ipc.localhost ws://ipc.localhost http://127.0.0.1:1430 https://api.groq.com https://api.openai.com https://api.mistral.ai https://*; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline';" />
  <title>Fluence Overlay</title>
  <link rel="stylesheet" href="css/overlay.css" />
</head>
<body>
  <div class="overlay-root" id="overlay-root">
    <!-- SVG Microphone Icon -->
    <svg class="pill-mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
      <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
      <line x1="12" x2="12" y1="19" y2="22"></line>
    </svg>

    <canvas id="waveform-canvas"></canvas>

    <!-- Success checkmark icon -->
    <div class="status-icon success-icon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3.3335 8.00016L6.66683 11.3335L13.3335 4.66683" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- Error cross icon -->
    <div class="status-icon error-icon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <script src="js/audio-viz.js"></script>
  <script src="js/overlay.js"></script>
</body>
</html>
